<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Laboratorio · Elenco en escena</title>
<meta name="theme-color" content="#0d1310">
<link rel="stylesheet" href="../fuentes/fuentes.css">
<link rel="stylesheet" href="../estilos.css">
<style>
  body { padding-bottom: 40px; }
  .lab-barra { padding: calc(12px + env(safe-area-inset-top)) var(--gutter) 10px; max-width: 560px; margin: 0 auto; }
  .lab-barra p { margin: 0 0 10px; font: 600 12px/1 var(--display); letter-spacing: .24em; text-transform: uppercase; color: var(--tenue); }
  .lab-tabs { display: flex; gap: 6px; }
  .lab-tabs button, .seg button {
    flex: 1; padding: 11px 10px; border-radius: 999px; border: 1px solid var(--linea); background: transparent; cursor: pointer;
    font: 700 14px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); touch-action: manipulation;
  }
  .lab-tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: var(--fondo); }
  .lab-nota { max-width: 560px; margin: 12px auto 0; padding: 0 var(--gutter); color: var(--pendiente); font-size: 14px; line-height: 1.45; }

  /* ---------- Escenario (común) ---------- */
  .esc { max-width: 560px; margin: 14px auto 0; padding: 0 var(--gutter); }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .cuadro {
    position: relative; height: min(74vh, 680px); height: min(74svh, 680px); border-radius: 22px; overflow: hidden;
    background: radial-gradient(70% 55% at 50% 30%, #12342a, #0a110e 75%); isolation: isolate;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .caras { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  .cara {
    position: relative; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; background: var(--superficie-2);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .25); touch-action: manipulation; transition: transform .35s var(--curva);
  }
  .cara img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; opacity: .55; transition: opacity .3s ease; }
  .cara.activa { transform: translateY(-4px); }
  .cara.activa img { opacity: 1; }
  .cara .aro { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); rotate: -90deg; pointer-events: none; }
  .cara .aro circle { fill: none; stroke: var(--coral); stroke-width: 2.4; stroke-dasharray: 100; stroke-dashoffset: 100; stroke-linecap: round; }
  .cara.activa .aro circle { stroke-dashoffset: 0; }
  .cara.activa.corre .aro circle { animation: aro var(--t) linear both; }
  @keyframes aro { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

  /* texto sobre el escenario */
  .velo { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; z-index: 4; pointer-events: none; background: linear-gradient(transparent, rgba(6, 11, 9, .82) 45%, rgba(6, 11, 9, .95)); }
  .texto { position: absolute; left: 18px; right: 18px; bottom: 16px; z-index: 5; }
  .texto .papel { margin: 0 0 8px; font: italic 800 clamp(26px, 8vw, 36px)/.9 var(--display); text-transform: uppercase; color: var(--coral); rotate: -5deg; transform-origin: left bottom; }
  .texto .pill {
    display: inline-block; margin: 0; padding: 9px 16px 7px; border-radius: 999px; background: #2bd394; color: #14211b;
    font: 800 clamp(21px, 6.4vw, 28px)/1 var(--display); text-transform: uppercase; letter-spacing: .02em;
  }
  .texto .pill.par { background: #dca56c; }
  .texto .bio { margin: 10px 0 0; color: #dfe6e1; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .texto.abierto .bio { display: block; -webkit-line-clamp: unset; max-height: 38svh; overflow-y: auto; overscroll-behavior: contain; }
  .texto .leer { margin-top: 2px; padding: 12px 0 4px; border: 0; background: none; cursor: pointer; color: var(--teal-claro); font: 600 13px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
  .texto .pregunta { margin: 0; font: italic 800 clamp(28px, 8.4vw, 40px)/1 var(--display); text-transform: uppercase; color: #dca56c; rotate: -4deg; }
  .texto .pista { margin: 12px 0 0; font: 600 12px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--tenue); }
  .texto.entra > * { animation: entra .6s var(--curva) both; }
  .texto.entra > :nth-child(2) { animation-delay: .07s; }
  .texto.entra > :nth-child(3) { animation-delay: .14s; }
  .texto.entra > :nth-child(4) { animation-delay: .2s; }
  @keyframes entra { from { opacity: 0; transform: translateY(14px); } }
  .texto.sale { opacity: 0; transition: opacity .2s ease; }

  /* ---------- 1 · Cámara ---------- */
  .camara { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform 1.15s cubic-bezier(.65, 0, .25, 1); will-change: transform; }
  .camara .capa { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .7s ease .15s; }
  .camara .capa.on { opacity: 1; }
  .camara .capa:not(.on) { visibility: hidden; transition: opacity .7s ease .15s, visibility 0s linear .9s; }
  .camara .toque { position: absolute; width: 13%; height: 22%; translate: -50% -40%; border: 0; padding: 0; background: transparent; border-radius: 40%; cursor: pointer; touch-action: manipulation; }
  .cuadro .sombra { position: absolute; inset: 0; z-index: 2; background: rgba(6, 11, 9, .55); opacity: 0; transition: opacity .6s ease; pointer-events: none; }
  .cuadro.con-recorte .sombra { opacity: 1; }
  .recorte {
    position: absolute; left: 50%; bottom: 0; z-index: 3; height: 88%; width: auto; max-width: none; translate: -50% 0;
    opacity: 0; transform: translateY(7%) scale(.8); transform-origin: 50% 100%; pointer-events: none;
    transition: opacity .45s ease, transform .45s var(--curva);
  }
  .recorte.on { opacity: 1; transform: none; transition: opacity .8s ease, transform 1.1s var(--curva); }

  /* ---------- 2 · Barrido ---------- */
  .lamina { position: absolute; inset: 0; overflow: hidden; -webkit-clip-path: circle(150% at 100% 0%); clip-path: circle(150% at 100% 0%); }
  .lamina.entra { animation: barrer .95s cubic-bezier(.65, 0, .25, 1) both; }
  @keyframes barrer { from { -webkit-clip-path: circle(0% at 100% 0%); clip-path: circle(0% at 100% 0%); } }
  .lamina.l0 { background: radial-gradient(70% 55% at 50% 30%, #12342a, #0a110e 75%); }
  .lamina.verde { background: #2bd394; }
  .lamina.tostado { background: #dca56c; }
  .lamina .curva { position: absolute; right: -30%; top: -25%; width: 95%; aspect-ratio: 1; border-radius: 50%; background: #0f5a45; opacity: .9; }
  .lamina.tostado .curva { background: #13624b; }
  .lamina .foco-intro { position: absolute; left: 50%; top: 6%; width: 86%; translate: -50% 0; }
  .lamina .figura2 { position: absolute; bottom: 0; height: 80%; width: auto; max-width: none; opacity: 0; transform: translateY(8%) scale(.9); transform-origin: 50% 100%; transition: opacity .7s ease .35s, transform 1s var(--curva) .35s; }
  .lamina .figura2.izq { left: -6%; }
  .lamina .figura2.der { right: -6%; }
  .lamina.lista .figura2 { opacity: 1; transform: none; }
  .lamina .medallon {
    position: absolute; top: 9%; width: 70%; aspect-ratio: 1; border-radius: 50%; background-repeat: no-repeat; background-size: 330%;
    box-shadow: 0 0 0 6px rgba(255, 255, 255, .25), 0 20px 40px rgba(0, 0, 0, .35); opacity: 0; transform: scale(.7); transition: opacity .6s ease .3s, transform 1s var(--rebote) .3s;
  }
  .lamina .medallon.izq { left: 6%; }
  .lamina .medallon.der { right: 6%; }
  .lamina.lista .medallon { opacity: 1; transform: none; }
  .v2 .velo { background: linear-gradient(transparent, rgba(6, 11, 9, .7) 40%, rgba(6, 11, 9, .92)); height: 46%; }

  @media (prefers-reduced-motion: reduce) {
    .camara { transition: none; }
    .recorte, .recorte.on { transform: none; }
    .lamina.entra { animation: none; }
    .lamina .figura2, .lamina .medallon { transform: none; }
  }
</style>
</head>
<body>
<div class="grano" aria-hidden="true"></div>
<div class="lab-barra">
  <p>Laboratorio · el elenco en escena</p>
  <div class="lab-tabs" role="tablist">
    <button role="tab" aria-selected="true" data-op="1">1 · Cámara</button>
    <button role="tab" aria-selected="false" data-op="2">2 · Barrido</button>
  </div>
</div>
<p class="lab-nota" id="nota"></p>
<div id="escenario"></div>

<script src="personas.js"></script>
<script>
(function () {
  const P = window.PERSONAS;
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const I = "img/";
  const T = 5200; // tiempo por persona en automático
  let CARAS = {};
  const NOTAS = {
    1: "1 · Cámara: no se baja. La cámara entra en el foco hasta cada personaje y el recorte en grande sale adelante tapando la escena. Va sola, o tocá una silueta, una cara o deslizá.",
    2: "2 · Barrido: como los paneles del video. Cada personaje entra con un barrido de color que tapa al anterior. Va solo, o tocá una cara o deslizá.",
  };

  const pasos = (g) => [
    ...(g.portada ? [{ tipo: "portada" }] : []),
    { tipo: "pregunta", texto: g.pregunta || "La música, en vivo" },
    ...g.gente.map((p, k) => ({ tipo: "persona", p, k })),
  ];
  function textoHTML(paso) {
    if (paso.tipo === "portada") return "";
    if (paso.tipo === "pregunta") return `<p class="pregunta">${esc(paso.texto)}</p><p class="pista">Tocá una cara o deslizá</p>`;
    const p = paso.p;
    return `<p class="papel">${esc(p.personaje)}</p><h3 class="pill${paso.k % 2 ? " par" : ""}">${esc(p.nombre)}</h3>
      <p class="bio">${esc(p.bio)}</p><button class="leer" type="button">Leer más</button>`;
  }
  function ponerTexto(el, paso, demora) {
    el.classList.add("sale"); el.classList.remove("entra", "abierto");
    setTimeout(() => {
      el.innerHTML = textoHTML(paso);
      el.classList.remove("sale"); void el.offsetWidth; el.classList.add("entra");
      const l = $(".leer", el);
      if (l) l.addEventListener("click", (e) => { e.stopPropagation(); el.classList.toggle("abierto"); l.textContent = el.classList.contains("abierto") ? "Leer menos" : "Leer más"; detener(); });
    }, demora);
  }

  // automático + controles comunes
  let reloj = null, auto = true, actual = null;
  function detener() { auto = false; clearTimeout(reloj); $$(".cara").forEach((c) => c.classList.remove("corre")); }
  function controles(raiz, ps, ir) {
    const caras = $$(".cara", raiz);
    raiz.style.setProperty("--t", T + "ms");
    caras.forEach((c) => c.addEventListener("click", () => { detener(); ir(ps.findIndex((x) => x.p && x.p.id === c.dataset.id)); }));
    let x0 = null;
    const cuadro = $(".cuadro", raiz);
    cuadro.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
    cuadro.addEventListener("pointerup", (e) => {
      if (x0 === null) return; const dx = e.clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) { detener(); ir(Math.min(ps.length - 1, Math.max(0, actual + (dx < 0 ? 1 : -1)))); }
    });
    return (i) => {
      caras.forEach((c) => { c.classList.toggle("activa", !!ps[i].p && c.dataset.id === ps[i].p.id); c.classList.remove("corre"); });
      clearTimeout(reloj);
      if (!auto) return;
      const c = ps[i].p && caras.find((x) => x.dataset.id === ps[i].p.id);
      if (c && !quieto) { void c.offsetWidth; c.classList.add("corre"); }
      const sig = i + 1 < ps.length ? i + 1 : ps.findIndex((x) => x.p);
      reloj = setTimeout(() => ir(sig), ps[i].p ? T : 2400);
    };
  }
  const carasHTML = (g) => `<div class="caras">${g.gente.map((p) =>
    `<button class="cara" type="button" data-id="${p.id}" aria-label="${esc(p.nombre)}"><img src="${I}cara-${p.id}.webp" alt=""><svg class="aro" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"/></svg></button>`).join("")}</div>`;
  const segHTML = (grupo) => `<div class="seg"><button type="button" data-g="elenco" aria-pressed="${grupo === "elenco"}">Elenco</button><button type="button" data-g="banda" aria-pressed="${grupo === "banda"}">Banda</button></div>`;

  // ---------- 1 · Cámara ----------
  function camara(raiz, grupo) {
    const g = P[grupo], ps = pasos(g), conRecorte = grupo === "elenco";
    raiz.innerHTML = `<div class="esc v1">${segHTML(grupo)}
      <div class="cuadro">
        <div class="camara">
          <img class="capa on" data-k="vacia" src="${I}foco-${grupo}-vacia.webp" alt="">
          ${g.portada ? `<img class="capa" data-k="portada" src="${I}foco-portada.webp" alt="">` : ""}
          ${g.gente.map((p) => `<img class="capa" data-k="${p.id}" src="${I}foco-${p.id}.webp" alt="" decoding="async">`).join("")}
          ${g.gente.map((p) => { const c = CARAS[p.id] || [.5, .5]; return `<button class="toque" type="button" data-id="${p.id}" style="left:${c[0] * 100}%;top:${c[1] * 100}%" aria-label="${esc(p.nombre)}"></button>`; }).join("")}
        </div>
        <div class="sombra"></div>
        ${conRecorte ? g.gente.map((p) => `<img class="recorte" data-k="${p.id}" src="${I}recorte-${p.id}.webp" alt="${esc(p.nombre)}" decoding="async">`).join("") : ""}
        <div class="velo"></div>
        <div class="texto"></div>
      </div>${carasHTML(g)}</div>`;
    const cuadro = $(".cuadro", raiz), cam = $(".camara", raiz), texto = $(".texto", raiz);
    let W = 0, H = 0;
    const medir = () => { W = cuadro.clientWidth; H = cuadro.clientHeight; cam.style.width = cam.style.height = W + "px"; };
    medir();
    function encuadre(paso) {
      if (!paso.p) { // vista general: el foco entero arriba
        const s = Math.min(1, (H * 0.66) / W);
        return `translate(${((W - W * s) / 2).toFixed(1)}px, ${(H * 0.04).toFixed(1)}px) scale(${s.toFixed(3)})`;
      }
      const c = CARAS[paso.p.id] || [.5, .5], s = conRecorte ? 2.3 : 2.7;
      const fy = conRecorte ? 0.3 : 0.34;
      return `translate(${(W * 0.5 - c[0] * W * s).toFixed(1)}px, ${(H * fy - c[1] * W * s).toFixed(1)}px) scale(${s})`;
    }
    function ir(i) {
      actual = i; const paso = ps[i];
      const k = paso.tipo === "portada" ? "portada" : paso.p ? paso.p.id : "vacia";
      $$(".recorte", raiz).forEach((r) => r.classList.remove("on"));
      cuadro.classList.remove("con-recorte");
      cam.style.transform = encuadre(paso);
      $$(".capa", cam).forEach((c) => c.classList.toggle("on", c.dataset.k === k));
      if (paso.p && conRecorte) setTimeout(() => {
        if (actual !== i) return;
        cuadro.classList.add("con-recorte");
        const r = $(`.recorte[data-k="${paso.p.id}"]`, raiz); if (r) r.classList.add("on");
      }, quieto ? 0 : 620);
      ponerTexto(texto, paso, quieto ? 0 : paso.p ? 700 : 300);
      siguiente(i);
    }
    const siguiente = controles(raiz, ps, ir);
    $$(".toque", raiz).forEach((t) => t.addEventListener("click", () => { detener(); ir(ps.findIndex((x) => x.p && x.p.id === t.dataset.id)); }));
    addEventListener("resize", () => { medir(); if (actual !== null) cam.style.transform = encuadre(ps[actual]); });
    cam.style.transition = "none"; cam.style.transform = encuadre(ps[0]); void cam.offsetWidth; cam.style.transition = "";
    ir(0);
  }

  // ---------- 2 · Barrido ----------
  function barrido(raiz, grupo) {
    const g = P[grupo], ps = pasos(g), conRecorte = grupo === "elenco";
    raiz.innerHTML = `<div class="esc v2">${segHTML(grupo)}
      <div class="cuadro"><div class="laminas"></div><div class="velo"></div><div class="texto"></div></div>${carasHTML(g)}</div>`;
    const laminas = $(".laminas", raiz), texto = $(".texto", raiz);
    function lamina(paso) {
      const d = document.createElement("div");
      if (!paso.p) {
        d.className = "lamina l0";
        d.innerHTML = `<img class="foco-intro" src="${I}foco-${paso.tipo === "portada" ? "portada" : grupo + "-vacia"}.webp" alt="">`;
      } else {
        const lado = paso.k % 2 ? "izq" : "der";
        d.className = "lamina " + (paso.k % 2 ? "tostado" : "verde");
        const c = CARAS[paso.p.id] || [.5, .5];
        d.innerHTML = `<span class="curva"></span>` + (conRecorte
          ? `<img class="figura2 ${lado}" src="${I}recorte-${paso.p.id}.webp" alt="${esc(paso.p.nombre)}">`
          : `<div class="medallon ${lado}" style="background-image:url(${I}foco-${paso.p.id}.webp);background-position:${(c[0] * 100).toFixed(1)}% ${(c[1] * 100 + 6).toFixed(1)}%"></div>`);
      }
      return d;
    }
    function ir(i) {
      actual = i; const paso = ps[i];
      const d = lamina(paso);
      laminas.appendChild(d);
      if (!quieto) d.classList.add("entra");
      requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add("lista")));
      // las de abajo se van cuando la nueva terminó de taparlas
      setTimeout(() => { while (laminas.children.length > 1 && laminas.firstChild !== d) laminas.firstChild.remove(); }, 1000);
      ponerTexto(texto, paso, quieto ? 0 : paso.p ? 520 : 250);
      siguiente(i);
    }
    const siguiente = controles(raiz, ps, ir);
    ir(0);
  }

  // ---------- armado ----------
  let op = "1", grupo = "elenco";
  const raiz = $("#escenario");
  function montar() {
    clearTimeout(reloj); auto = true; actual = null;
    $("#nota").textContent = NOTAS[op];
    (op === "1" ? camara : barrido)(raiz, grupo);
    $$(".seg button", raiz).forEach((b) => b.addEventListener("click", () => { grupo = b.dataset.g; montar(); }));
  }
  $$(".lab-tabs button").forEach((t) => t.addEventListener("click", () => {
    $$(".lab-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === t)));
    op = t.dataset.op; history.replaceState(null, "", "#" + op); montar();
  }));
  document.addEventListener("touchstart", () => {}, { passive: true });
  fetch("img/caras.json").then((r) => r.json()).then((c) => {
    CARAS = c;
    if (location.hash === "#2") { op = "2"; $$(".lab-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x.dataset.op === "2"))); }
    montar();
  });
})();
</script>
</body>
</html>
